name: Blogger Autoblog & Webhook Runner

on:
  schedule:
    # Runs at off-peak minutes (:17 and :47) every hour to avoid GitHub Actions congestion
    - cron: '17,47 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (preview without publishing)'
        required: false
        default: false
        type: boolean
      feed_name:
        description: 'Run only one feed name from feeds.json (leave blank for all)'
        required: false
        default: ''
        type: string
      custom_title:
        description: 'Optional: publish a custom post title instead of RSS'
        required: false
        default: ''
        type: string
      custom_content:
        description: 'Optional: custom post HTML/text body'
        required: false
        default: ''
        type: string
      custom_labels:
        description: 'Optional: comma-separated labels for custom post'
        required: false
        default: ''
        type: string
      custom_is_draft:
        description: 'Save custom post as Draft'
        required: false
        default: false
        type: boolean

  repository_dispatch:
    # Webhook event types:
    # - "run-rss"       (optional client_payload: {"feed_name": "...", "dry_run": false})
    # - "publish-post"  (client_payload: {"title": "...", "content": "...", "labels": ["News"], "source_url": "...", "is_draft": false})
    types:
      - run-rss
      - publish-post

permissions:
  contents: write

concurrency:
  group: autoblog-sqlite
  cancel-in-progress: false

jobs:
  autoblog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Autoblog Pipeline
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ACTION: ${{ github.event.action }}
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FEED_NAME: ${{ inputs.feed_name }}
          INPUT_CUSTOM_TITLE: ${{ inputs.custom_title }}
          INPUT_CUSTOM_CONTENT: ${{ inputs.custom_content }}
          INPUT_CUSTOM_LABELS: ${{ inputs.custom_labels }}
          INPUT_CUSTOM_IS_DRAFT: ${{ inputs.custom_is_draft }}
        run: |
          python - << 'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          event = os.environ.get("EVENT_NAME", "manual")
          action = os.environ.get("DISPATCH_ACTION", "")
          cmd = [sys.executable, "autoblog.py"]

          if event == "repository_dispatch":
              raw_payload = os.environ.get("CLIENT_PAYLOAD") or "{}"
              try:
                  payload = json.loads(raw_payload) if raw_payload != "null" else {}
              except Exception:
                  payload = {}
              if not isinstance(payload, dict):
                  payload = {}
              if action == "publish-post":
                  payload_file = Path("/tmp/webhook_payload.json")
                  payload_file.write_text(json.dumps(payload), encoding="utf-8")
                  cmd.extend(["--publish-file", str(payload_file), "--trigger-type", "webhook"])
                  if payload.get("dry_run"):
                      cmd.append("--dry-run")
              else:
                  cmd.extend(["--trigger-type", "webhook"])
                  if payload.get("dry_run"):
                      cmd.append("--dry-run")
                  if payload.get("feed_name"):
                      cmd.extend(["--feed", str(payload["feed_name"])])

          elif event == "workflow_dispatch":
              custom_title = (os.environ.get("INPUT_CUSTOM_TITLE") or "").strip()
              custom_content = (os.environ.get("INPUT_CUSTOM_CONTENT") or "").strip()
              if custom_title and custom_content:
                  payload = {
                      "title": custom_title,
                      "content": custom_content,
                      "labels": os.environ.get("INPUT_CUSTOM_LABELS", ""),
                      "is_draft": os.environ.get("INPUT_CUSTOM_IS_DRAFT", "false").lower() == "true",
                  }
                  payload_file = Path("/tmp/manual_payload.json")
                  payload_file.write_text(json.dumps(payload), encoding="utf-8")
                  cmd.extend(["--publish-file", str(payload_file), "--trigger-type", "manual"])
              else:
                  cmd.extend(["--trigger-type", "manual"])
                  feed_name = (os.environ.get("INPUT_FEED_NAME") or "").strip()
                  if feed_name:
                      cmd.extend(["--feed", feed_name])

              if os.environ.get("INPUT_DRY_RUN", "false").lower() == "true":
                  cmd.append("--dry-run")

          else:
              cmd.extend(["--trigger-type", "schedule"])

          raise SystemExit(subprocess.call(cmd))
          PY

      - name: Commit updated SQLite database
        run: |
          if [ -f data/blog.db ] && [ -n "$(git status --porcelain data/blog.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/blog.db
            git commit -m "chore: update SQLite autoblog archive [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No SQLite changes to commit."
          fi
